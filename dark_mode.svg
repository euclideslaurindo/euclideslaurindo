<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400">
  <style>
    .bg { fill: #0d1117; }
    .header { fill: #161b22; }
    .btn-r { fill: #ff5f56; }
    .btn-y { fill: #ffbd2e; }
    .btn-g { fill: #27c93f; }
    .text { font-family: 'Courier New', Courier, monospace; font-size: 16px; font-weight: bold; fill: #c9d1d9; }
    .keyword { fill: #ff7b72; }
    .class-name { fill: #d2a8ff; }
    .method { fill: #d2a8ff; }
    .string { fill: #a5d6ff; }
    .comment { fill: #8b949e; font-style: italic; }
    .cursor {
      fill: #c9d1d9;
      animation: blink 1s step-end infinite;
    }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
  </style>

  <rect class="bg" width="800" height="400" rx="10" ry="10" />
  
  <rect class="header" width="800" height="30" rx="10" ry="10" />
  <circle class="btn-r" cx="20" cy="15" r="6" />
  <circle class="btn-y" cx="40" cy="15" r="6" />
  <circle class="btn-g" cx="60" cy="15" r="6" />
  <text x="400" y="20" font-family="'Courier New', Courier, monospace" font-size="14" fill="#8b949e" text-anchor="middle">euclides@backend-dev: ~</text>

  <text x="30" y="70" class="text">
    <tspan class="keyword">package</tspan> br.gov.pe.gre.developer;
  </text>
  
  <text x="30" y="110" class="text">
    <tspan class="comment">// 🚀 Desenvolvedor Backend | Google Student Ambassador | UFAPE</tspan>
  </text>
  
  <text x="30" y="140" class="text">
    <tspan class="keyword">public</tspan> <tspan class="keyword">class</tspan> <tspan class="class-name">EuclidesLaurindo</tspan> {
  </text>

  <text x="60" y="180" class="text">
    <tspan class="keyword">private</tspan> String <tspan class="class-name">role</tspan> = <tspan class="string">"Backend Developer"</tspan>;
  </text>

  <text x="60" y="210" class="text">
    <tspan class="keyword">private</tspan> String[] <tspan class="class-name">stack</tspan> = {<tspan class="string">"Java"</tspan>, <tspan class="string">"Spring Boot"</tspan>, <tspan class="string">"C++"</tspan>, <tspan class="string">"SQL"</tspan>, <tspan class="string">"Google Apps Script"</tspan>};
  </text>

  <text x="60" y="250" class="text">
    <tspan class="keyword">public</tspan> <tspan class="keyword">void</tspan> <tspan class="method">execute</tspan>() {
  </text>

  <text x="90" y="280" class="text">
    System.out.println(<tspan class="string">"Resolvendo problemas reais com código limpo e arquitetura sólida."</tspan>);
  </text>
  
  <text x="90" y="310" class="text">
